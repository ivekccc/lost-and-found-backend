spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lost-and-found}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tvoj_cloud_name}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
app.share.public-base-url=${PUBLIC_BASE_URL:}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
app.flyway.seed-enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
app.embedding.model-dir=${EMBEDDING_MODEL_DIR:${user.home}/.cache/lost-and-found/models/paraphrase-multilingual-minilm}
