spring.application.name=lost-and-found-backend
server.port=8082
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.flyway.enabled=false
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=900000
jwt.refresh-token.expiration-ms=604800000
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.default-flat-param-object=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.version=openapi_3_0
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.verification.expiry-minutes=10
app.cleanup.interval-ms=3600000
locationiq.api-key=${LOCATIONIQ_API_KEY}
locationiq.base-url=https://api.locationiq.com/v1
locationiq.default-country=rs
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.upload-folder=lost-and-found
app.push.max-retry-count=3

app.cities.default-code=BG

app.share.public-base-url=${PUBLIC_BASE_URL}
app.share.android-package=lost.and.found.android
app.share.play-store-url=https://play.google.com/store/apps/details?id=lost.and.found.android

app.matching.rescan-interval-ms=21600000

app.reports.default-ttl-days=60
app.reports.expiry-reminder-days=3
app.reports.expiry-sweep-interval-ms=3600000
app.statistics.minimum-reunited=0

app.flyway.seed-enabled=false
app.security.allowed-origins=${ALLOWED_ORIGINS}
app.security.max-request-bytes=262144
jwt.issuer=lost-and-found
jwt.refresh-token.user-session-lifetime-days=30
jwt.refresh-token.admin-session-lifetime-hours=12

server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=262144
server.tomcat.max-http-form-post-size=262144
server.max-http-request-header-size=16KB
server.shutdown=graceful

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Europe/Belgrade'; SET statement_timeout = '30s'; SET lock_timeout = '5s'; SET idle_in_transaction_session_timeout = '60s'
app.flyway.username=${FLYWAY_USERNAME:}
app.flyway.password=${FLYWAY_PASSWORD:}
