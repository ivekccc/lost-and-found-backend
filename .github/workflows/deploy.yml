name: Build & Deploy Backend to Azure

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lost-and-found-backend
  APP_NAME: lost-and-found-api
  RESOURCE_GROUP: lost-and-found-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Azure (OIDC, no stored credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App to new image
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            -o none

      - name: Wait for the new revision to become ready
        run: |
          for i in {1..40}; do
            latest=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query "properties.latestRevisionName" -o tsv)
            ready=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query "properties.latestReadyRevisionName" -o tsv)
            echo "Attempt $i: latest=$latest ready=$ready"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "The new revision did not become ready."
          exit 1

      - name: Smoke test
        run: |
          URL=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in {1..10}; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "https://$URL/users/me" || true)
            echo "GET /users/me without a token -> HTTP $code"
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 15
          done
          exit 1
